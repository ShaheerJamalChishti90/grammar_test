<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjectives with Prepositions Test - SJC Tech</title>
    <style>
        :root {
            --primary: #1f3a93;
            --secondary: #34495e;
            --correct-dark: #006400; 
            --incorrect-dark: #8B0000; 
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f7;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        .header h1 { color: var(--primary); margin-bottom: 5px; }
        .header h3 { color: var(--secondary); margin-top: 0; font-weight: normal; }
        
        .example-instruction {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px 15px;
            border-left: 5px solid #ffeeba;
            border-radius: 5px;
            margin-bottom: 30px;
            font-size: 15px;
            font-style: italic;
            text-align: center;
        }
        
        .question-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .question-text { 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 15px;
        }
        
        .option-label {
            display: flex;
            align-items: center;
            background-color: #f0f2f5;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            font-size: 15px;
        }
        .option-label input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .option-label:hover {
            background-color: #e2e6ea;
        }
        
        .option-label.correct {
            background-color: var(--correct-dark) !important;
            color: white;
            font-weight: bold;
        }
        .option-label.incorrect {
            background-color: var(--incorrect-dark) !important;
            color: white;
            font-weight: bold;
        }
        
        .question-card.locked {
            pointer-events: none;
        }

        .controls { text-align: center; margin: 40px 0; }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #219150; }
        
        #score-display {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #e8f8f5;
            border-radius: 8px;
            display: none;
        }

        #error-report {
            display: none;
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-top: 5px solid var(--incorrect-dark);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #error-report h2 { color: var(--incorrect-dark); margin-top: 0; }
        .error-item {
            border-bottom: 2px solid #eee;
            padding: 20px 0;
        }
        .error-item:last-child { border-bottom: none; }
        
        .wrong-ans { 
            background-color: var(--incorrect-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }
        .right-ans { 
            background-color: var(--correct-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }
        
        .reason-text { font-style: italic; color: #333; background: #f0f0f0; padding: 12px; border-radius: 5px; margin-top: 10px; border-left: 4px solid var(--primary); }
        .rule-badge { display: inline-block; background: var(--primary); color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-style: normal; font-weight: bold; margin-bottom: 5px; }

        @media print {
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .controls { display: none; }
            .question-card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
            #error-report { display: block !important; page-break-before: always; box-shadow: none; border: 1px solid #ccc; }
            .error-item { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Adjectives with Prepositions (of, about, with)</h1>
        <h3>Instructor: Muhammad Shaheer Jamal Chishti</h3>
        <p>Total Questions: 30</p>
    </div>

    <div class="example-instruction">
        Instruction: Choose the correct preposition that pairs with the adjective in each sentence.
    </div>

    <div id="quiz-container"></div>
    
    <div class="controls">
        <button onclick="finishTest()">Finish Test & Generate PDF Report</button>
    </div>

    <div id="score-display">Final Score: <span id="final-score">0</span> / 30</div>
    <div id="error-report"></div>

    <script>
        const quizData = [
            // "of" questions
            { rule: "Adjective + of", q: "1. It was very good ___ you to help me with my homework.", options: ["of", "about", "with"], a: "of" },
            { rule: "Adjective + of", q: "2. She is terrified ___ spiders and insects.", options: ["about", "with", "of"], a: "of" },
            { rule: "Adjective + of", q: "3. He was accused ___ stealing the expensive car.", options: ["of", "with", "about"], a: "of" },
            { rule: "Adjective + of", q: "4. I am fully aware ___ the risks involved in this project.", options: ["with", "about", "of"], a: "of" },
            { rule: "Adjective + of", q: "5. They are very proud ___ their son's achievements at school.", options: ["of", "about", "with"], a: "of" },
            { rule: "Adjective + of", q: "6. Are you capable ___ finishing this task by tomorrow?", options: ["with", "of", "about"], a: "of" },
            { rule: "Adjective + of", q: "7. The teacher was extremely fond ___ all her students.", options: ["of", "with", "about"], a: "of" },
            { rule: "Adjective + of", q: "8. The glass on the table is completely full ___ water.", options: ["about", "of", "with"], a: "of" },
            { rule: "Adjective + of", q: "9. The jury found that she was innocent ___ the crime.", options: ["with", "about", "of"], a: "of" },
            { rule: "Adjective + of", q: "10. He is getting tired ___ eating the same food every day.", options: ["of", "about", "with"], a: "of" },

            // "about" questions
            { rule: "Adjective + about", q: "11. My father is very excited ___ his new job promotion.", options: ["of", "about", "with"], a: "about" },
            { rule: "Adjective + about", q: "12. Are you sure you are happy ___ the final decision?", options: ["about", "with", "of"], a: "about" },
            { rule: "Adjective + about", q: "13. She was very upset ___ losing her favorite watch.", options: ["with", "of", "about"], a: "about" },
            { rule: "Adjective + about", q: "14. I am quite anxious ___ the upcoming exam results.", options: ["about", "of", "with"], a: "about" },
            { rule: "Adjective + about", q: "15. He is crazy ___ playing video games all night.", options: ["with", "about", "of"], a: "about" },
            { rule: "Adjective + about", q: "16. They were curious ___ what was inside the hidden box.", options: ["about", "with", "of"], a: "about" },
            { rule: "Adjective + about", q: "17. The manager was furious ___ the delay in the project.", options: ["of", "about", "with"], a: "about" },
            { rule: "Adjective + about", q: "18. Why are you so pessimistic ___ the future?", options: ["about", "with", "of"], a: "about" },
            { rule: "Adjective + about", q: "19. She is deeply worried ___ her mother's health.", options: ["with", "of", "about"], a: "about" },
            { rule: "Adjective + about", q: "20. He was deeply sorry ___ breaking the expensive vase.", options: ["about", "with", "of"], a: "about" },

            // "with" questions
            { rule: "Adjective + with", q: "21. Tom was very pleased ___ his excellent test score.", options: ["with", "about", "of"], a: "with" },
            { rule: "Adjective + with", q: "22. I am getting completely bored ___ this long movie.", options: ["of", "with", "about"], a: "with" },
            { rule: "Adjective + with", q: "23. She was disappointed ___ the poor service at the restaurant.", options: ["about", "with", "of"], a: "with" },
            { rule: "Adjective + with", q: "24. Adel's uncle was very angry ___ him for being late.", options: ["with", "of", "about"], a: "with" },
            { rule: "Adjective + with", q: "25. Are you familiar ___ the new software system?", options: ["of", "with", "about"], a: "with" },
            { rule: "Adjective + with", q: "26. The new apartment is fully furnished ___ modern furniture.", options: ["with", "about", "of"], a: "with" },
            { rule: "Adjective + with", q: "27. He is heavily involved ___ the university's sports club.", options: ["of", "about", "with"], a: "with" },
            { rule: "Adjective + with", q: "28. Please be patient ___ the new trainees.", options: ["with", "of", "about"], a: "with" },
            { rule: "Adjective + with", q: "29. The teacher was highly impressed ___ the student's final presentation.", options: ["about", "with", "of"], a: "with" },
            { rule: "Adjective + with", q: "30. I am completely satisfied ___ the quality of the work.", options: ["with", "of", "about"], a: "with" }
        ];

        let score = 0;
        let incorrectLog = [];
        const container = document.getElementById('quiz-container');
        const answeredQuestions = new Set();

        // Render the Quiz
        quizData.forEach((item, qIndex) => {
            const qCard = document.createElement('div');
            qCard.className = 'question-card';
            qCard.id = `card-${qIndex}`;
            
            let html = `<div class="question-text">${item.q}</div>`;
            
            item.options.forEach((opt, optIndex) => {
                html += `
                    <label class="option-label" id="label-${qIndex}-${optIndex}">
                        <input type="radio" name="q${qIndex}" value="${opt}" onchange="checkAnswer(${qIndex}, '${opt}', '${item.a}', this, '${item.rule}')">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = html;
            container.appendChild(qCard);
        });

        // Validation Logic
        function checkAnswer(qIndex, selectedAns, correctAns, radioInput, rule) {
            const card = document.getElementById(`card-${qIndex}`);
            
            if (card.classList.contains('locked')) return;

            answeredQuestions.add(qIndex);
            const label = radioInput.parentElement;

            if (selectedAns === correctAns) {
                label.classList.add('correct');
                score++;
            } else {
                label.classList.add('incorrect');
                
                incorrectLog.push({
                    q: quizData[qIndex].q,
                    studentAns: selectedAns,
                    correctAns: correctAns,
                    rule: rule
                });
            }

            card.classList.add('locked');
            
            const nextCard = document.getElementById(`card-${qIndex + 1}`);
            if (nextCard) {
                setTimeout(() => {
                    nextCard.scrollIntoView({ behavior: "smooth", block: "center" });
                }, 400);
            }
        }

        // Explanations for the Report
        function getExplanation(rule) {
            switch(rule) {
                case "Adjective + of": return "Certain adjectives are naturally followed by 'of', such as good of, kind of, afraid of, accused of, aware of, proud of, capable of, fond of, full of, innocent of, and tired of.";
                case "Adjective + about": return "Certain adjectives are naturally followed by 'about', such as excited about, happy about, upset about, anxious about, crazy about, curious about, furious about, pessimistic about, worried about, and sorry about.";
                case "Adjective + with": return "Certain adjectives are naturally followed by 'with', such as pleased with, bored with, disappointed with, angry with (someone), familiar with, furnished with, involved with, patient with, impressed with, and satisfied with.";
                default: return "Review standard adjective and preposition pairings.";
            }
        }

        // Finalize Test
        function finishTest() {
            quizData.forEach((item, index) => {
                if (!answeredQuestions.has(index)) {
                    document.getElementById(`card-${index}`).classList.add('locked');
                    incorrectLog.push({
                        q: item.q,
                        studentAns: "(Left Blank)",
                        correctAns: item.a,
                        rule: item.rule
                    });
                }
            });

            document.getElementById('score-display').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            
            const reportDiv = document.getElementById('error-report');
            
            if (incorrectLog.length > 0) {
                let html = `<h2>Correction Report</h2><p>Please review the rules below for the answers you got wrong or missed.</p>`;
                
                incorrectLog.forEach((err) => {
                    html += `
                    <div class="error-item">
                        <span class="rule-badge">Tested Topic: ${err.rule}</span>
                        <p class="question-text">${err.q}</p>
                        <div class="wrong-ans">[X] Your Answer: ${err.studentAns}</div>
                        <div class="right-ans">[+] Correct Answer: ${err.correctAns}</div>
                        <p class="reason-text"><strong>Grammar Rule:</strong> ${getExplanation(err.rule)}</p>
                    </div>`;
                });
                reportDiv.innerHTML = html;
            } else {
                reportDiv.innerHTML = `<h2 style="color:var(--correct-dark)">Perfect Score! Outstanding Job.</h2>`;
            }
            
            reportDiv.style.display = 'block';
            
            setTimeout(() => {
                window.print();
            }, 500);
        }
    </script>
</body>
</html>
