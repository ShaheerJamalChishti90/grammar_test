<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjunctions Grammar Test - SJC Tech</title>
    <style>
        :root {
            --primary: #1f3a93;
            --secondary: #34495e;
            --correct-dark: #006400; 
            --incorrect-dark: #8B0000; 
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f7;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        .header h1 { color: var(--primary); margin-bottom: 5px; }
        .header h3 { color: var(--secondary); margin-top: 0; font-weight: normal; }
        
        .example-instruction {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px 15px;
            border-left: 5px solid #ffeeba;
            border-radius: 5px;
            margin-bottom: 30px;
            font-size: 15px;
            font-style: italic;
            text-align: center;
        }
        
        .question-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .question-text { 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 15px;
        }
        
        .option-label {
            display: flex;
            align-items: center;
            background-color: #f0f2f5;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            font-size: 15px;
        }
        .option-label input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .option-label:hover {
            background-color: #e2e6ea;
        }
        
        .option-label.correct {
            background-color: var(--correct-dark) !important;
            color: white;
            font-weight: bold;
        }
        .option-label.incorrect {
            background-color: var(--incorrect-dark) !important;
            color: white;
            font-weight: bold;
        }
        
        .question-card.locked {
            pointer-events: none;
        }

        .controls { text-align: center; margin: 40px 0; }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #219150; }
        
        #score-display {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #e8f8f5;
            border-radius: 8px;
            display: none;
        }

        #error-report {
            display: none;
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-top: 5px solid var(--incorrect-dark);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #error-report h2 { color: var(--incorrect-dark); margin-top: 0; }
        .error-item {
            border-bottom: 2px solid #eee;
            padding: 20px 0;
        }
        .error-item:last-child { border-bottom: none; }
        
        .wrong-ans { 
            background-color: var(--incorrect-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }
        .right-ans { 
            background-color: var(--correct-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }
        
        .reason-text { font-style: italic; color: #333; background: #f0f0f0; padding: 12px; border-radius: 5px; margin-top: 10px; border-left: 4px solid var(--primary); }
        .rule-badge { display: inline-block; background: var(--primary); color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-style: normal; font-weight: bold; margin-bottom: 5px; }

        @media print {
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .controls { display: none; }
            .question-card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
            #error-report { display: block !important; page-break-before: always; box-shadow: none; border: 1px solid #ccc; }
            .error-item { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Conjunctions Master Test</h1>
        <h3>Instructor: Muhammad Shaheer Jamal Chishti</h3>
        <p>Total Questions: 30</p>
    </div>

    <div class="example-instruction">
        Instruction: Read carefully. Answer by selecting the correct conjunction, or by identifying the correct rule/clause type.
    </div>

    <div id="quiz-container"></div>
    
    <div class="controls">
        <button onclick="finishTest()">Finish Test & Generate PDF Report</button>
    </div>

    <div id="score-display">Final Score: <span id="final-score">0</span> / 30</div>
    <div id="error-report"></div>

    <script>
        const quizData = [
            // Coordinating
            { type: "Coordinating", q: "1. I wanted to go to the park, ___ it started to rain heavily.", options: ["but", "or", "so"], a: "but" },
            { type: "Coordinating", q: "2. Would you like to have tea, ___ would you prefer coffee?", options: ["and", "or", "yet"], a: "or" },
            { type: "Coordinating", q: "3. Identify the type of conjunction: 'She was very tired, **so** she went to bed early.'", options: ["Subordinating Conjunction", "Coordinating Conjunction", "Correlative Conjunction"], a: "Coordinating Conjunction" },
            { type: "Coordinating", q: "4. He doesn't like eating apples, ___ does he like bananas.", options: ["nor", "or", "for"], a: "nor" },
            { type: "Coordinating", q: "5. They studied hard for weeks, ___ they passed the exam easily.", options: ["and", "but", "yet"], a: "and" },
            { type: "Coordinating", q: "6. Identify the type of conjunction: 'I drank a glass of water, **for** I was extremely thirsty.'", options: ["Correlative Conjunction", "Subordinating Conjunction", "Coordinating Conjunction"], a: "Coordinating Conjunction" },
            { type: "Coordinating", q: "7. The weather was freezing cold, ___ we still went for a walk outside.", options: ["so", "yet", "nor"], a: "yet" },
            { type: "Coordinating", q: "8. She went to the grocery store ___ bought a carton of milk.", options: ["and", "but", "so"], a: "and" },
            { type: "Coordinating", q: "9. I have to wake up very early tomorrow, ___ I am going to sleep right now.", options: ["so", "for", "or"], a: "so" },
            { type: "Coordinating", q: "10. The acronym 'FANBOYS' is used to remember which type of conjunctions?", options: ["Subordinating Conjunctions", "Correlative Conjunctions", "Coordinating Conjunctions"], a: "Coordinating Conjunctions" },

            // Subordinating
            { type: "Subordinating", q: "11. We stayed inside the house ___ it was raining heavily.", options: ["because", "although", "unless"], a: "because" },
            { type: "Subordinating", q: "12. ___ she was very tired, she finished all her homework.", options: ["Because", "Although", "Until"], a: "Although" },
            { type: "Subordinating", q: "13. Identify the type of conjunction: 'I will call you **when** I arrive at the station.'", options: ["Coordinating Conjunction", "Correlative Conjunction", "Subordinating Conjunction"], a: "Subordinating Conjunction" },
            { type: "Subordinating", q: "14. You cannot watch television ___ you finish your vegetables.", options: ["unless", "while", "since"], a: "unless" },
            { type: "Subordinating", q: "15. I have known my best friend ___ we were in kindergarten.", options: ["after", "since", "until"], a: "since" },
            { type: "Subordinating", q: "16. Please make sure to wash your hands ___ you eat your dinner.", options: ["while", "before", "although"], a: "before" },
            { type: "Subordinating", q: "17. Identify the clause type: '**While I was reading a book**, the telephone rang.' What type of clause is in bold?", options: ["Independent Clause (Main)", "Dependent Clause (Subordinate)", "Coordinate Clause"], a: "Dependent Clause (Subordinate)" },
            { type: "Subordinating", q: "18. We will wait right here ___ the bus arrives.", options: ["until", "because", "as if"], a: "until" },
            { type: "Subordinating", q: "19. He acts ___ he knows everything about the subject.", options: ["unless", "as if", "before"], a: "as if" },
            { type: "Subordinating", q: "20. Identify the type of conjunction: 'We left early **in order that** we wouldn't miss the train.'", options: ["Correlative Conjunction", "Coordinating Conjunction", "Subordinating Conjunction"], a: "Subordinating Conjunction" },

            // Correlative
            { type: "Correlative", q: "21. ___ my brother and my sister are doctors.", options: ["Both", "Either", "Neither"], a: "Both" },
            { type: "Correlative", q: "22. You can choose ___ the red shirt or the blue shirt.", options: ["both", "either", "neither"], a: "either" },
            { type: "Correlative", q: "23. Identify the conjunctions: '**Neither** the teacher **nor** the students knew the answer.'", options: ["Subordinating Conjunctions", "Coordinating Conjunctions", "Correlative Conjunctions"], a: "Correlative Conjunctions" },
            { type: "Correlative", q: "24. She is ___ only intelligent, but also very hardworking.", options: ["not", "both", "neither"], a: "not" },
            { type: "Correlative", q: "25. I don't know ___ I should buy the car or save my money.", options: ["whether", "either", "both"], a: "whether" },
            { type: "Correlative", q: "26. He ate ___ the chocolate cake and the vanilla ice cream.", options: ["either", "both", "not only"], a: "both" },
            { type: "Correlative", q: "27. Correlative conjunctions always work in ___.", options: ["paragraphs", "pairs", "clauses"], a: "pairs" },
            { type: "Correlative", q: "28. ___ had I sat down to rest than the doorbell rang.", options: ["No sooner", "Not only", "Whether"], a: "No sooner" },
            { type: "Correlative", q: "29. The mathematics test was ___ long but also extremely difficult.", options: ["both", "neither", "not only"], a: "not only" },
            { type: "Correlative", q: "30. 'Whether / or' is an example of which type of conjunction?", options: ["Coordinating Conjunction", "Correlative Conjunction", "Subordinating Conjunction"], a: "Correlative Conjunction" }
        ];

        let score = 0;
        let incorrectLog = [];
        const container = document.getElementById('quiz-container');
        const answeredQuestions = new Set();

        // Render the Quiz
        quizData.forEach((item, qIndex) => {
            const qCard = document.createElement('div');
            qCard.className = 'question-card';
            qCard.id = `card-${qIndex}`;
            
            let html = `<div class="question-text">${item.q}</div>`;
            
            item.options.forEach((opt, optIndex) => {
                html += `
                    <label class="option-label" id="label-${qIndex}-${optIndex}">
                        <input type="radio" name="q${qIndex}" value="${opt}" onchange="checkAnswer(${qIndex}, '${opt}', '${item.a}', this, '${item.type}')">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = html;
            container.appendChild(qCard);
        });

        // Validation Logic
        function checkAnswer(qIndex, selectedAns, correctAns, radioInput, type) {
            const card = document.getElementById(`card-${qIndex}`);
            
            if (card.classList.contains('locked')) return;

            answeredQuestions.add(qIndex);
            const label = radioInput.parentElement;

            if (selectedAns === correctAns) {
                label.classList.add('correct');
                score++;
            } else {
                label.classList.add('incorrect');
                
                incorrectLog.push({
                    q: quizData[qIndex].q,
                    studentAns: selectedAns,
                    correctAns: correctAns,
                    type: type
                });
            }

            card.classList.add('locked');
            
            const nextCard = document.getElementById(`card-${qIndex + 1}`);
            if (nextCard) {
                setTimeout(() => {
                    nextCard.scrollIntoView({ behavior: "smooth", block: "center" });
                }, 400);
            }
        }

        // Explanations for the Report
        function getExplanation(type) {
            switch(type) {
                case "Coordinating": return "Coordinating conjunctions connect words, phrases, or clauses of equal rank. Remember the acronym FANBOYS (For, And, Nor, But, Or, Yet, So).";
                case "Subordinating": return "Subordinating conjunctions join an independent clause and a dependent clause. They show a relationship of time, cause/effect, or condition (e.g., because, although, while, since, unless, until, as if).";
                case "Correlative": return "Correlative conjunctions always work in pairs to connect elements of equal rank (e.g., either/or, neither/nor, both/and, not only/but also, whether/or).";
                default: return "Review standard conjunction rules.";
            }
        }

        // Finalize Test
        function finishTest() {
            quizData.forEach((item, index) => {
                if (!answeredQuestions.has(index)) {
                    document.getElementById(`card-${index}`).classList.add('locked');
                    incorrectLog.push({
                        q: item.q,
                        studentAns: "(Left Blank)",
                        correctAns: item.a,
                        type: item.type
                    });
                }
            });

            document.getElementById('score-display').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            
            const reportDiv = document.getElementById('error-report');
            
            if (incorrectLog.length > 0) {
                let html = `<h2>Correction Report</h2><p>Please review the rules below for the answers you got wrong or missed.</p>`;
                
                incorrectLog.forEach((err) => {
                    html += `
                    <div class="error-item">
                        <span class="rule-badge">Topic: ${err.type} Conjunctions</span>
                        <p class="question-text">${err.q}</p>
                        <div class="wrong-ans">[X] Your Answer: ${err.studentAns}</div>
                        <div class="right-ans">[+] Correct Answer: ${err.correctAns}</div>
                        <p class="reason-text"><strong>Grammar Rule:</strong> ${getExplanation(err.type)}</p>
                    </div>`;
                });
                reportDiv.innerHTML = html;
            } else {
                reportDiv.innerHTML = `<h2 style="color:var(--correct-dark)">Perfect Score! Outstanding Job.</h2>`;
            }
            
            reportDiv.style.display = 'block';
            
            setTimeout(() => {
                window.print();
            }, 500);
        }
    </script>
</body>
</html>
