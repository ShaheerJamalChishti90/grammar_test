<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adverbs Grammar Test - SJC Tech</title>
    <style>
        :root {
            --primary: #1f3a93;
            --secondary: #34495e;
            --correct-dark: #006400; 
            --incorrect-dark: #8B0000; 
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f7;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        .header h1 { color: var(--primary); margin-bottom: 5px; }
        .header h3 { color: var(--secondary); margin-top: 0; font-weight: normal; }
        
        .section-title {
            background-color: var(--primary);
            color: white;
            padding: 12px 15px;
            border-radius: 5px;
            margin-top: 40px;
            margin-bottom: 0px;
        }
        .example-instruction {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px 15px;
            border-left: 5px solid #ffeeba;
            border-radius: 0 0 5px 5px;
            margin-bottom: 20px;
            font-size: 14px;
            font-style: italic;
        }
        
        .question-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .question-text { 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 15px;
        }
        
        .option-label {
            display: flex;
            align-items: center;
            background-color: #f0f2f5;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            font-size: 15px;
        }
        .option-label input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .option-label:hover {
            background-color: #e2e6ea;
        }
        
        .option-label.correct {
            background-color: var(--correct-dark) !important;
            color: white;
            font-weight: bold;
        }
        .option-label.incorrect {
            background-color: var(--incorrect-dark) !important;
            color: white;
            font-weight: bold;
        }
        
        .question-card.locked {
            pointer-events: none;
        }

        .controls { text-align: center; margin: 40px 0; }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #219150; }
        
        #score-display {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #e8f8f5;
            border-radius: 8px;
            display: none;
        }

        #error-report {
            display: none;
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-top: 5px solid var(--incorrect-dark);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #error-report h2 { color: var(--incorrect-dark); margin-top: 0; }
        .error-item {
            border-bottom: 2px solid #eee;
            padding: 20px 0;
        }
        .error-item:last-child { border-bottom: none; }
        
        .wrong-ans { 
            background-color: var(--incorrect-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }
        .right-ans { 
            background-color: var(--correct-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }
        
        .reason-text { font-style: italic; color: #333; background: #f0f0f0; padding: 12px; border-radius: 5px; margin-top: 10px; border-left: 4px solid var(--primary); }

        @media print {
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .controls { display: none; }
            .question-card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
            #error-report { display: block !important; page-break-before: always; box-shadow: none; border: 1px solid #ccc; }
            .error-item { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Adverbs Test</h1>
        <h3>Instructor: Muhammad Shaheer Jamal Chishti</h3>
        <p>Total Questions: 20 | Topics: Manner, Time, Place, Frequency</p>
    </div>

    <div id="quiz-container"></div>
    
    <div class="controls">
        <button onclick="finishTest()">Finish Test & Generate PDF Report</button>
    </div>

    <div id="score-display">Final Score: <span id="final-score">0</span> / 20</div>
    <div id="error-report"></div>

    <script>
        const quizData = [
            // SECTION 1: ADVERBS OF MANNER
            { section: "Section 1: Adverbs of Manner", example: "Instruction: Choose the correct adverb that tells us HOW an action happens.", q: "1. Juan grinned ___.", options: ["mischievously", "yesterday", "outside"], a: "mischievously" },
            { q: "2. Carlos works ___ to finish his tasks.", options: ["efficiently", "tomorrow", "always"], a: "efficiently" },
            { q: "3. The doctor told me to breathe ___.", options: ["deeply", "never", "soon"], a: "deeply" },
            { q: "4. James smiled ___ at the camera.", options: ["sweetly", "anywhere", "hourly"], a: "sweetly" },
            { q: "5. She waited ___ for the test results.", options: ["anxiously", "upstairs", "recently"], a: "anxiously" },

            // SECTION 2: ADVERBS OF TIME
            { section: "Section 2: Adverbs of Time", example: "Instruction: Choose the correct adverb that tells us WHEN an action happens.", q: "6. Pablo repainted the walls ___.", options: ["recently", "lazily", "inside"], a: "recently" },
            { q: "7. We will have the meeting ___ week.", options: ["next", "always", "quickly"], a: "next" },
            { q: "8. Have you seen Juan ___?", options: ["lately", "somewhere", "happily"], a: "lately" },
            { q: "9. The train is arriving ___ today.", options: ["late", "beautifully", "underground"], a: "late" },
            { q: "10. I will be ready ___.", options: ["soon", "there", "usually"], a: "soon" },

            // SECTION 3: ADVERBS OF PLACE
            { section: "Section 3: Adverbs of Place", example: "Instruction: Choose the correct adverb that tells us WHERE an action happens.", q: "11. You can put the bags ___.", options: ["anywhere", "eventually", "carefully"], a: "anywhere" },
            { q: "12. The children are playing ___ in the garden.", options: ["outside", "usually", "loudly"], a: "outside" },
            { q: "13. He walked ___ to get his jacket.", options: ["upstairs", "hourly", "simply"], a: "upstairs" },
            { q: "14. They traveled ___ for their summer vacation.", options: ["abroad", "sometimes", "tightly"], a: "abroad" },
            { q: "15. The subway travels ___ to avoid traffic.", options: ["underground", "tomorrow", "easily"], a: "underground" },

            // SECTION 4: ADVERBS OF FREQUENCY
            { section: "Section 4: Adverbs of Frequency", example: "Instruction: Choose the correct adverb that tells us HOW OFTEN an action happens.", q: "16. She ___ eats dessert after dinner.", options: ["never", "outside", "sweetly"], a: "never" },
            { q: "17. We ___ go to the park on Sundays.", options: ["usually", "recently", "underground"], a: "usually" },
            { q: "18. I ___ forget to bring my umbrella.", options: ["sometimes", "upstairs", "loudly"], a: "sometimes" },
            { q: "19. They are ___ complaining about the weather.", options: ["always", "here", "gradually"], a: "always" },
            { q: "20. He ___ visits his grandparents on weekends.", options: ["often", "abroad", "anxiously"], a: "often" }
        ];

        let score = 0;
        let incorrectLog = [];
        let currentSection = "";
        const container = document.getElementById('quiz-container');
        const answeredQuestions = new Set();

        // Render the Quiz
        quizData.forEach((item, qIndex) => {
            if (item.section) {
                currentSection = item.section;
                const secTitle = document.createElement('h2');
                secTitle.className = 'section-title';
                secTitle.innerText = item.section;
                container.appendChild(secTitle);
                
                const instruction = document.createElement('div');
                instruction.className = 'example-instruction';
                instruction.innerText = item.example;
                container.appendChild(instruction);
            }

            const qCard = document.createElement('div');
            qCard.className = 'question-card';
            qCard.id = `card-${qIndex}`;
            
            let html = `<div class="question-text">${item.q}</div>`;
            
            item.options.forEach((opt, optIndex) => {
                html += `
                    <label class="option-label" id="label-${qIndex}-${optIndex}">
                        <input type="radio" name="q${qIndex}" value="${opt}" onchange="checkAnswer(${qIndex}, '${opt}', '${item.a}', this, '${currentSection}')">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = html;
            container.appendChild(qCard);
        });

        // Validation Logic
        function checkAnswer(qIndex, selectedAns, correctAns, radioInput, section) {
            const card = document.getElementById(`card-${qIndex}`);
            
            if (card.classList.contains('locked')) return;

            answeredQuestions.add(qIndex);

            const label = radioInput.parentElement;

            if (selectedAns === correctAns) {
                label.classList.add('correct');
                score++;
            } else {
                label.classList.add('incorrect');
                
                incorrectLog.push({
                    q: quizData[qIndex].q,
                    studentAns: selectedAns,
                    correctAns: correctAns,
                    section: section
                });
            }

            card.classList.add('locked');
            
            const nextCard = document.getElementById(`card-${qIndex + 1}`);
            if (nextCard) {
                setTimeout(() => {
                    nextCard.scrollIntoView({ behavior: "smooth", block: "center" });
                }, 400);
            }
        }

        // Grammar Explanations for Report
        function getExplanation(sectionName) {
            if(sectionName.includes('Manner')) {
                return "An adverb of manner tells us how an action happens[cite: 1]. Examples: mischievously, efficiently, deeply, sweetly.";
            }
            if(sectionName.includes('Time')) {
                return "An adverb of time tells us when an action happens[cite: 1]. Examples: recently, lately, tomorrow, soon.";
            }
            if(sectionName.includes('Place')) {
                return "An adverb of place tells us where an action happens[cite: 1]. Examples: anywhere, outside, upstairs, abroad.";
            }
            if(sectionName.includes('Frequency')) {
                return "An adverb of frequency says how often something happens[cite: 1]. Examples: always, usually, often, sometimes, never.";
            }
            return "Review standard adverb rules.";
        }

        // Finalize Test
        function finishTest() {
            quizData.forEach((item, index) => {
                if (!answeredQuestions.has(index)) {
                    document.getElementById(`card-${index}`).classList.add('locked');
                    incorrectLog.push({
                        q: item.q,
                        studentAns: "(Left Blank)",
                        correctAns: item.a,
                        section: item.section || "General"
                    });
                }
            });

            document.getElementById('score-display').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            
            const reportDiv = document.getElementById('error-report');
            
            if (incorrectLog.length > 0) {
                let html = `<h2>Correction Report</h2><p>Please review the rules below for the answers you got wrong or missed.</p>`;
                
                incorrectLog.forEach((err) => {
                    html += `
                    <div class="error-item">
                        <p class="question-text">${err.q}</p>
                        <div class="wrong-ans">[X] Your Answer: ${err.studentAns}</div>
                        <div class="right-ans">[+] Correct Answer: ${err.correctAns}</div>
                        <p class="reason-text"><strong>Why is it wrong?</strong> ${getExplanation(err.section)}</p>
                    </div>`;
                });
                reportDiv.innerHTML = html;
            } else {
                reportDiv.innerHTML = `<h2 style="color:var(--correct-dark)">Perfect Score! Outstanding Job.</h2>`;
            }
            
            reportDiv.style.display = 'block';
            
            setTimeout(() => {
                window.print();
            }, 500);
        }
    </script>
</body>
</html>
