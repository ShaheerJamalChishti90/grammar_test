<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Grand Test - SJC Tech</title>
    <style>
        :root {
            --primary: #1f3a93;
            --secondary: #34495e;
            --correct-dark: #006400; 
            --incorrect-dark: #8B0000; 
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f7;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        .header h1 { color: var(--primary); margin-bottom: 5px; }
        .header h3 { color: var(--secondary); margin-top: 0; font-weight: normal; }
        
        .section-title {
            background-color: var(--primary);
            color: white;
            padding: 12px 15px;
            border-radius: 5px;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        
        .question-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .question-text { 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 15px;
        }
        
        .option-label {
            display: flex;
            align-items: center;
            background-color: #f0f2f5;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            font-size: 15px;
        }
        .option-label input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .option-label:hover {
            background-color: #e2e6ea;
        }
        
        .option-label.correct {
            background-color: var(--correct-dark) !important;
            color: white;
            font-weight: bold;
        }
        .option-label.incorrect {
            background-color: var(--incorrect-dark) !important;
            color: white;
            font-weight: bold;
        }
        
        .question-card.locked {
            pointer-events: none;
        }

        .controls { text-align: center; margin: 40px 0; }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #219150; }
        
        #score-display {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #e8f8f5;
            border-radius: 8px;
            display: none;
        }

        #error-report {
            display: none;
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-top: 5px solid var(--incorrect-dark);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #error-report h2 { color: var(--incorrect-dark); margin-top: 0; }
        .error-item {
            border-bottom: 2px solid #eee;
            padding: 20px 0;
        }
        .error-item:last-child { border-bottom: none; }
        
        .wrong-ans { 
            background-color: var(--incorrect-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }
        .right-ans { 
            background-color: var(--correct-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }

        @media print {
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .controls { display: none; }
            .question-card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
            #error-report { display: block !important; page-break-before: always; box-shadow: none; border: 1px solid #ccc; }
            .error-item { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Week 1 Grand Test</h1>
        <h3>Instructor: Muhammad Shaheer Jamal Chishti</h3>
        <p>Total Questions: 30 | Topics: Punctuation, Nouns, Pronouns</p>
    </div>

    <div id="quiz-container"></div>
    
    <div class="controls">
        <button onclick="finishTest()">Finish Test & Generate PDF Report</button>
    </div>

    <div id="score-display">Final Score: <span id="final-score">0</span> / 30</div>
    <div id="error-report"></div>

    <script>
        const quizData = [
            // SECTION 1: PUNCTUATION (10 Qs based on missed concepts)
            { section: "Section 1: The Capital Letter & Punctuation", q: "1. Choose the sentence with the correct capitalization:", options: ["we are going to london next monday.", "We are going to London next Monday.", "We are going to london next Monday."], a: "We are going to London next Monday." },
            { q: "2. Choose the correctly punctuated sentence:", options: ["Theyr'e going to the park later.", "They're going to the park later.", "Theyre going to the park later."], a: "They're going to the park later." },
            { q: "3. Choose the correctly punctuated sentence regarding possession:", options: ["The childrens playground is closed.", "The children's playground is closed.", "The childrens' playground is closed."], a: "The children's playground is closed." },
            { q: "4. Choose the correctly punctuated sentence:", options: ["I wonder what time the train arrives.", "I wonder what time the train arrives?", "I wonder what time the train arrives!"], a: "I wonder what time the train arrives." },
            { q: "5. Choose the correctly punctuated list:", options: ["I need to buy milk bread eggs and butter.", "I need to buy milk, bread, eggs and butter.", "I need to buy milk, bread, eggs, and butter."], a: "I need to buy milk, bread, eggs, and butter." },
            { q: "6. Choose the correctly punctuated sentence containing an appositive:", options: ["My brother a talented musician plays the piano.", "My brother, a talented musician, plays the piano.", "My brother a talented musician, plays the piano."], a: "My brother, a talented musician, plays the piano." },
            { q: "7. Which of the following is an incomplete sentence?", options: ["The cat slept on the warm mat.", "Please pass the salt.", "Because it was raining outside."], a: "Because it was raining outside." },
            { q: "8. Choose the correctly punctuated sentence:", options: ["This is Peters backpack.", "This is Peter's backpack.", "This is Peters' backpack."], a: "This is Peter's backpack." },
            { q: "9. Choose the correctly punctuated sentence:", options: ["Why is the sky blue.", "Why is the sky blue?", "Why is the sky blue!"], a: "Why is the sky blue?" },
            { q: "10. Choose the correct spelling for the contraction of 'can not':", options: ["can't", "cant", "ca'nt"], a: "can't" },

            // SECTION 2: NOUNS (10 Qs based on missed concepts)
            { section: "Section 2: Nouns", q: "11. Identify the abstract noun in this sentence: 'The soldier showed great bravery.'", options: ["soldier", "showed", "bravery"], a: "bravery" },
            { q: "12. Is the noun 'Information' countable or uncountable?", options: ["Countable", "Uncountable"], a: "Uncountable" },
            { q: "13. What is the correct plural form of the noun 'Leaf'?", options: ["Leafs", "Leaves", "Leavs"], a: "Leaves" },
            { q: "14. What is the correct feminine form of the noun 'Actor'?", options: ["Actoress", "Actress", "Actorine"], a: "Actress" },
            { q: "15. What is the correct feminine form of the noun 'Tiger'?", options: ["Tigeres", "Tigress", "Tigeress"], a: "Tigress" },
            { q: "16. Identify the proper noun(s) in this sentence: 'We traveled to Japan last summer.'", options: ["Japan", "Japan, summer", "traveled, Japan"], a: "Japan" },
            { q: "17. Identify the correct collective noun: 'We saw a ___ of fish swimming in the coral reef.'", options: ["herd", "school", "swarm"], a: "school" },
            { q: "18. Identify the common nouns in this sentence: 'The doctor works in a hospital.'", options: ["doctor", "hospital", "doctor, hospital"], a: "doctor, hospital" },
            { q: "19. What is the correct plural form of the noun 'Tooth'?", options: ["Tooths", "Teeth", "Teethes"], a: "Teeth" },
            { q: "20. Identify the abstract noun in this sentence: 'The beauty of the painting amazed us.'", options: ["beauty", "painting", "beauty, amazed"], a: "beauty" },

            // SECTION 3: PRONOUNS (10 Qs based on missed concepts)
            { section: "Section 3: Pronouns", q: "21. The kids are old enough to look after ___.", options: ["themself", "theirselves", "themselves"], a: "themselves" },
            { q: "22. The cat washed ___ carefully after eating dinner.", options: ["himself", "itself", "themselves"], a: "itself" },
            { q: "23. My brother and ___ went to the park yesterday.", options: ["me", "mine", "I"], a: "I" },
            { q: "24. The teacher handed the test papers to ___.", options: ["they", "their", "them"], a: "them" },
            { q: "25. Out of all the paintings across the room, I want to buy ___.", options: ["this", "that", "these"], a: "that" },
            { q: "26. Look at ___ dark clouds gathering over the mountains far away.", options: ["this", "these", "those"], a: "those" },
            { q: "27. Hello, ___ is Mark speaking. Is Sarah available? (On the phone)", options: ["this", "that", "these"], a: "this" },
            { q: "28. To ___ should I address this formal email?", options: ["who", "whom", "whose"], a: "whom" },
            { q: "29. The musician, ___ I admire greatly, is coming to our city.", options: ["who", "whom", "which"], a: "whom" },
            { q: "30. He is the only person ___ can solve this difficult puzzle.", options: ["who", "whom", "which"], a: "who" }
        ];

        let score = 0;
        let incorrectLog = [];
        const container = document.getElementById('quiz-container');
        const answeredQuestions = new Set();

        // Render the Quiz
        quizData.forEach((item, qIndex) => {
            if (item.section) {
                const secTitle = document.createElement('h2');
                secTitle.className = 'section-title';
                secTitle.innerText = item.section;
                container.appendChild(secTitle);
            }

            const qCard = document.createElement('div');
            qCard.className = 'question-card';
            qCard.id = `card-${qIndex}`;
            
            let html = `<div class="question-text">${item.q}</div>`;
            
            item.options.forEach((opt, optIndex) => {
                html += `
                    <label class="option-label" id="label-${qIndex}-${optIndex}">
                        <input type="radio" name="q${qIndex}" value="${opt}" onchange="checkAnswer(${qIndex}, '${opt}', '${item.a}', this)">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = html;
            container.appendChild(qCard);
        });

        // Validation Logic
        function checkAnswer(qIndex, selectedAns, correctAns, radioInput) {
            const card = document.getElementById(`card-${qIndex}`);
            
            if (card.classList.contains('locked')) return;

            answeredQuestions.add(qIndex);
            const label = radioInput.parentElement;

            if (selectedAns === correctAns) {
                label.classList.add('correct');
                score++;
            } else {
                label.classList.add('incorrect');
                
                incorrectLog.push({
                    q: quizData[qIndex].q,
                    studentAns: selectedAns,
                    correctAns: correctAns
                });
            }

            card.classList.add('locked');
            
            const nextCard = document.getElementById(`card-${qIndex + 1}`);
            if (nextCard) {
                setTimeout(() => {
                    nextCard.scrollIntoView({ behavior: "smooth", block: "center" });
                }, 400);
            }
        }

        // Finalize Test
        function finishTest() {
            quizData.forEach((item, index) => {
                if (!answeredQuestions.has(index)) {
                    document.getElementById(`card-${index}`).classList.add('locked');
                    incorrectLog.push({
                        q: item.q,
                        studentAns: "(Left Blank)",
                        correctAns: item.a
                    });
                }
            });

            document.getElementById('score-display').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            
            const reportDiv = document.getElementById('error-report');
            
            if (incorrectLog.length > 0) {
                let html = `<h2>Correction Report</h2><p>Please review the correct answers below.</p>`;
                
                incorrectLog.forEach((err) => {
                    html += `
                    <div class="error-item">
                        <p class="question-text">${err.q}</p>
                        <div class="wrong-ans">[X] Your Answer: ${err.studentAns}</div>
                        <div class="right-ans">[+] Correct Answer: ${err.correctAns}</div>
                    </div>`;
                });
                reportDiv.innerHTML = html;
            } else {
                reportDiv.innerHTML = `<h2 style="color:var(--correct-dark)">Perfect Score! Outstanding Job.</h2>`;
            }
            
            reportDiv.style.display = 'block';
            
            setTimeout(() => {
                window.print();
            }, 500);
        }
    </script>
</body>
</html>
