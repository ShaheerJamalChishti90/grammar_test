<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Grand Test: Tenses Masterclass - SJC Tech</title>
    <style>
        :root {
            --primary: #1f3a93;
            --secondary: #34495e;
            --correct-dark: #006400; 
            --incorrect-dark: #8B0000; 
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f7;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        .header h1 { color: var(--primary); margin-bottom: 5px; }
        .header h3 { color: var(--secondary); margin-top: 0; font-weight: normal; }
        
        .section-title {
            background-color: var(--primary);
            color: white;
            padding: 12px 15px;
            border-radius: 5px;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        
        .question-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
        }

        .question-text { 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 15px;
        }
        
        .option-label {
            display: flex;
            align-items: center;
            background-color: #f0f2f5;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            font-size: 15px;
        }
        .option-label input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .option-label:hover {
            background-color: #e2e6ea;
        }
        
        .option-label.correct {
            background-color: var(--correct-dark) !important;
            color: white;
            font-weight: bold;
        }
        .option-label.incorrect {
            background-color: var(--incorrect-dark) !important;
            color: white;
            font-weight: bold;
        }
        
        .question-card.locked {
            pointer-events: none;
        }

        .controls { text-align: center; margin: 40px 0; }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #219150; }
        
        #score-display {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #e8f8f5;
            border-radius: 8px;
            display: none;
        }

        #error-report {
            display: none;
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-top: 5px solid var(--incorrect-dark);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #error-report h2 { color: var(--incorrect-dark); margin-top: 0; }
        .error-item {
            border-bottom: 2px solid #eee;
            padding: 20px 0;
        }
        .error-item:last-child { border-bottom: none; }
        
        .wrong-ans { 
            background-color: var(--incorrect-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }
        .right-ans { 
            background-color: var(--correct-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }

        .reason-text { font-style: italic; color: #333; background: #f0f0f0; padding: 12px; border-radius: 5px; margin-top: 10px; border-left: 4px solid var(--primary); }

        @media print {
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .controls { display: none; }
            .question-card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
            #error-report { display: block !important; page-break-before: always; box-shadow: none; border: 1px solid #ccc; }
            .error-item { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Week 3 Grand Test: Tenses Masterclass</h1>
        <h3>Instructor: Muhammad Shaheer Jamal Chishti</h3>
        <p>Total Questions: 30 | Topics: Identification & Logical Transformations</p>
    </div>

    <div id="quiz-container"></div>
    
    <div class="controls">
        <button onclick="finishTest()">Finish Test & Generate PDF Report</button>
    </div>

    <div id="score-display">Final Score: <span id="final-score">0</span> / 30</div>
    <div id="error-report"></div>

    <script>
        const quizData = [
            // PART 1: IDENTIFICATION & LOGIC (12 Base + 3 Tricky)
            { section: "Part 1: Tenses Identification & Logical Context", q: "1. The museum doors ___ at 9:00 AM every day.", options: ["open", "opens", "are opening"], a: "open", rule: "Present Simple: The plural subject 'doors' takes the base verb 'open' to state a routine or schedule." },
            { q: "2. Please whisper; the baby ___ right now.", options: ["sleeps", "is sleeping", "has slept"], a: "is sleeping", rule: "Present Continuous: Context clues like 'right now' and 'Please whisper' indicate an action happening at the exact moment of speaking." },
            { q: "3. I cannot buy the tickets because I ___ my wallet.", options: ["lost", "lose", "have lost"], a: "have lost", rule: "Present Perfect: A past action (losing the wallet) at an unspecified time that has a heavy result in the present (cannot buy tickets)." },
            { q: "4. Your eyes are completely red. ___ you ___ all afternoon?", options: ["Are / crying", "Have / been crying", "Did / cry"], a: "Have / been crying", rule: "Present Perfect Continuous: There is present visible evidence (red eyes) caused by a continuous action stretching from the past up to now." },
            { q: "5. William Shakespeare ___ 'Romeo and Juliet' hundreds of years ago.", options: ["writes", "wrote", "has written"], a: "wrote", rule: "Past Simple: The action was fully completed in a specific, finished time in the past." },
            { q: "6. While the teacher ___, the fire alarm suddenly went off.", options: ["explained", "was explaining", "had explained"], a: "was explaining", rule: "Past Continuous: Used for a longer action in progress that was interrupted by a sudden, shorter past action." },
            { q: "7. When I finally reached the airport, the plane ___.", options: ["left", "has left", "had left"], a: "had left", rule: "Past Perfect: The 'past of the past'. The plane left *before* the action of arriving at the airport." },
            { q: "8. They were completely exhausted because they ___ for four hours.", options: ["were practicing", "have been practicing", "had been practicing"], a: "had been practicing", rule: "Past Perfect Continuous: Measures the duration of a continuous action leading up to a specific point in the past." },
            { q: "9. Oh no, we are out of milk! I ___ to the store right now.", options: ["am going", "will go", "go"], a: "will go", rule: "Future Simple: Used for spontaneous decisions made at the exact moment of speaking." },
            { q: "10. Do not call me at 10 AM tomorrow; I ___ a presentation.", options: ["will give", "will be giving", "will have given"], a: "will be giving", rule: "Future Continuous: Projects into the middle of an action that will be in progress at a specific time in the future." },
            { q: "11. By the time you wake up, the snow ___ completely.", options: ["will stop", "will be stopping", "will have stopped"], a: "will have stopped", rule: "Future Perfect: Used when an action will be fully completed *before* a specific deadline or event in the future." },
            { q: "12. By December, our professor ___ at this university for twenty years.", options: ["will be teaching", "will have been teaching", "will teach"], a: "will have been teaching", rule: "Future Perfect Continuous: Measures duration leading up to a specific time in the future." },
            { q: "13. (Logical Challenge) I ___ what you mean, but I ___ with you.", options: ["am seeing / am not agreeing", "see / do not agree", "see / am not agreeing"], a: "see / do not agree", rule: "Stative verbs (like see, agree, understand, know) describe states, not actions, and are strictly used in simple tenses, not continuous." },
            { q: "14. (Logical Challenge) When I ___ the room, they ___ about me, but they immediately ___ talking.", options: ["entered / were talking / stopped", "was entering / talked / stopped", "entered / talked / were stopping"], a: "entered / were talking / stopped", rule: "Narrative sequence: An interruption (entered) of a continuous action (were talking), followed immediately by a sequential action (stopped)." },
            { q: "15. (Logical Challenge) I promise I will call you as soon as I ___ at the hotel.", options: ["will arrive", "arrive", "am arriving"], a: "arrive", rule: "Future Time Clause Rule: In clauses starting with 'as soon as', 'when', or 'if', we always use the Present Simple to refer to the future." },

            // PART 2: TRANSFORMATIONS (12 Base + 3 Tricky)
            { section: "Part 2: Sentence Transformations", q: "16. Choose the correct Negative form: 'She plays the piano.'", options: ["She not plays the piano.", "She does not play the piano.", "She does not plays the piano."], a: "She does not play the piano.", rule: "Present Simple Negative: Use 'does not' + the base form of the verb (without 's')." },
            { q: "17. Choose the correct Interrogative form: 'They are watching TV.'", options: ["Are they watching TV?", "Do they are watching TV?", "Are they watch TV?"], a: "Are they watching TV?", rule: "Present Continuous Interrogative: Swap the subject (they) and the auxiliary verb (are)." },
            { q: "18. Choose the correct Affirmative form: 'He has not seen that movie.'", options: ["He has saw that movie.", "He have seen that movie.", "He has seen that movie."], a: "He has seen that movie.", rule: "Present Perfect Affirmative: Remove 'not'. The subject 'He' takes 'has' + V3 (seen)." },
            { q: "19. Choose the correct Interrogative form: 'It has been raining all day.'", options: ["Has it been raining all day?", "Has been it raining all day?", "Does it have been raining all day?"], a: "Has it been raining all day?", rule: "Present Perfect Continuous Interrogative: Only the first auxiliary 'Has' moves before the subject 'it'." },
            { q: "20. Choose the correct Negative form: 'He bought a new car.'", options: ["He did not bought a new car.", "He did not buy a new car.", "He had not buy a new car."], a: "He did not buy a new car.", rule: "Past Simple Negative: Use 'did not' + the base form of the verb (buy), not the past tense (bought)." },
            { q: "21. Choose the correct Affirmative form: 'Were you sleeping?'", options: ["You were sleeping.", "You was sleeping.", "You did sleeping."], a: "You were sleeping.", rule: "Past Continuous Affirmative: Swap the auxiliary 'were' back to follow the subject 'you'." },
            { q: "22. Choose the correct Affirmative form: 'She had not finished the report.'", options: ["She finished the report.", "She has finished the report.", "She had finished the report."], a: "She had finished the report.", rule: "Past Perfect Affirmative: Remove 'not'. Keep the past perfect structure 'had + V3'." },
            { q: "23. Choose the correct Negative form: 'They had been waiting for an hour.'", options: ["They had not been waiting for an hour.", "They had been not waiting for an hour.", "They did not had been waiting for an hour."], a: "They had not been waiting for an hour.", rule: "Past Perfect Continuous Negative: Place 'not' immediately after the first auxiliary verb 'had'." },
            { q: "24. Choose the correct Interrogative form: 'We will travel to Japan.'", options: ["Will we travel to Japan?", "Do we will travel to Japan?", "Will we traveling to Japan?"], a: "Will we travel to Japan?", rule: "Future Simple Interrogative: Move the modal auxiliary 'will' before the subject 'we'." },
            { q: "25. Choose the correct Affirmative form: 'I will not be working tomorrow.'", options: ["I am working tomorrow.", "I will be working tomorrow.", "I will working tomorrow."], a: "I will be working tomorrow.", rule: "Future Continuous Affirmative: Remove 'not'. Keep 'will be + V-ing'." },
            { q: "26. Choose the correct Negative form: 'He will have completed the task.'", options: ["He will not have completed the task.", "He will have not completed the task.", "He does not will have completed the task."], a: "He will not have completed the task.", rule: "Future Perfect Negative: Place 'not' immediately after the first auxiliary 'will'." },
            { q: "27. Choose the correct Interrogative form: 'She will have been studying.'", options: ["Will she have been studying?", "Will have she been studying?", "Has she will been studying?"], a: "Will she have been studying?", rule: "Future Perfect Continuous Interrogative: Only the first auxiliary 'Will' moves before the subject." },
            { q: "28. (Logical Challenge) Choose the correct Affirmative form: 'Does he have a car?'", options: ["He has a car.", "He does have a car.", "He haves a car."], a: "He has a car.", rule: "In the affirmative present simple, the main verb 'have' must correctly conjugate to 'has' for third-person singular subjects (he/she/it)." },
            { q: "29. (Logical Challenge) Choose the correct Negative form: 'He did his homework.'", options: ["He did not his homework.", "He did not do his homework.", "He not did his homework."], a: "He did not do his homework.", rule: "The first 'did' is the auxiliary verb for the negative structure, and the second 'do' is the main base verb expressing the action." },
            { q: "30. (Logical Challenge) Choose the correct Negative form: 'There will be a meeting tomorrow.'", options: ["There will not be a meeting tomorrow.", "There will be not a meeting tomorrow.", "There not will be a meeting tomorrow."], a: "There will not be a meeting tomorrow.", rule: "Place 'not' immediately after the modal auxiliary 'will', and before the main verb 'be'." }
        ];

        let score = 0;
        let incorrectLog = [];
        const container = document.getElementById('quiz-container');
        const answeredQuestions = new Set();

        // Render the Quiz
        quizData.forEach((item, qIndex) => {
            if (item.section) {
                const secTitle = document.createElement('h2');
                secTitle.className = 'section-title';
                secTitle.innerText = item.section;
                container.appendChild(secTitle);
            }

            const qCard = document.createElement('div');
            qCard.className = `question-card`;
            qCard.id = `card-${qIndex}`;
            
            let html = `
                <div class="question-text">${item.q}</div>
            `;
            
            item.options.forEach((opt, optIndex) => {
                html += `
                    <label class="option-label" id="label-${qIndex}-${optIndex}">
                        <input type="radio" name="q${qIndex}" value="${opt}" onchange="checkAnswer(${qIndex}, '${opt}', '${item.a}', this, '${item.rule.replace(/'/g, "\\'")}')">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = html;
            container.appendChild(qCard);
        });

        // Validation Logic
        function checkAnswer(qIndex, selectedAns, correctAns, radioInput, rule) {
            const card = document.getElementById(`card-${qIndex}`);
            
            if (card.classList.contains('locked')) return;

            answeredQuestions.add(qIndex);
            const label = radioInput.parentElement;

            if (selectedAns === correctAns) {
                label.classList.add('correct');
                score++;
            } else {
                label.classList.add('incorrect');
                
                incorrectLog.push({
                    q: quizData[qIndex].q,
                    studentAns: selectedAns,
                    correctAns: correctAns,
                    rule: rule
                });
            }

            card.classList.add('locked');
            
            const nextCard = document.getElementById(`card-${qIndex + 1}`);
            if (nextCard) {
                setTimeout(() => {
                    nextCard.scrollIntoView({ behavior: "smooth", block: "center" });
                }, 400);
            }
        }

        // Finalize Test
        function finishTest() {
            quizData.forEach((item, index) => {
                if (!answeredQuestions.has(index)) {
                    document.getElementById(`card-${index}`).classList.add('locked');
                    incorrectLog.push({
                        q: item.q,
                        studentAns: "(Left Blank)",
                        correctAns: item.a,
                        rule: item.rule
                    });
                }
            });

            document.getElementById('score-display').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            
            const reportDiv = document.getElementById('error-report');
            
            if (incorrectLog.length > 0) {
                let html = `<h2>Correction Report</h2><p>Review the exact logic and rules for the questions you missed.</p>`;
                
                incorrectLog.forEach((err) => {
                    html += `
                    <div class="error-item">
                        <p class="question-text">${err.q}</p>
                        <div class="wrong-ans">[X] Your Answer: ${err.studentAns}</div>
                        <div class="right-ans">[+] Correct Answer: ${err.correctAns}</div>
                        <p class="reason-text"><strong>Logical Rule:</strong> ${err.rule}</p>
                    </div>`;
                });
                reportDiv.innerHTML = html;
            } else {
                reportDiv.innerHTML = `<h2 style="color:var(--correct-dark)">Perfect Score! Outstanding Job.</h2>`;
            }
            
            reportDiv.style.display = 'block';
            
            setTimeout(() => {
                window.print();
            }, 500);
        }
    </script>
</body>
</html>
