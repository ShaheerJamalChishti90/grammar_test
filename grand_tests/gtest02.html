<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 2 Grade Test: Adjectives & Articles</title>
    <style>
        :root {
            --primary: #1f3a93;
            --secondary: #34495e;
            --correct-dark: #006400; 
            --incorrect-dark: #8B0000; 
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f7;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }
        .header h1 { color: var(--primary); margin-bottom: 5px; }
        .header h3 { color: var(--secondary); margin-top: 0; font-weight: normal; }
        
        .section-title {
            background-color: var(--primary);
            color: white;
            padding: 12px 15px;
            border-radius: 5px;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        
        .question-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
        }

        .question-text { 
            font-weight: bold; 
            font-size: 16px; 
            margin-bottom: 15px;
        }
        
        .option-label {
            display: flex;
            align-items: center;
            background-color: #f0f2f5;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            font-size: 15px;
        }
        .option-label input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .option-label:hover {
            background-color: #e2e6ea;
        }
        
        .option-label.correct {
            background-color: var(--correct-dark) !important;
            color: white;
            font-weight: bold;
        }
        .option-label.incorrect {
            background-color: var(--incorrect-dark) !important;
            color: white;
            font-weight: bold;
        }
        
        .question-card.locked {
            pointer-events: none;
        }

        .controls { text-align: center; margin: 40px 0; }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #219150; }
        
        #score-display {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #e8f8f5;
            border-radius: 8px;
            display: none;
        }

        #error-report {
            display: none;
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-top: 5px solid var(--incorrect-dark);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #error-report h2 { color: var(--incorrect-dark); margin-top: 0; }
        .error-item {
            border-bottom: 2px solid #eee;
            padding: 20px 0;
        }
        .error-item:last-child { border-bottom: none; }
        
        .wrong-ans { 
            background-color: var(--incorrect-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }
        .right-ans { 
            background-color: var(--correct-dark); 
            color: white; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 5px;
            margin-bottom: 8px;
            display: block;
        }

        .reason-text { font-style: italic; color: #333; background: #f0f0f0; padding: 12px; border-radius: 5px; margin-top: 10px; border-left: 4px solid var(--primary); }

        @media print {
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .controls { display: none; }
            .question-card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
            #error-report { display: block !important; page-break-before: always; box-shadow: none; border: 1px solid #ccc; }
            .error-item { page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Week 2 Grade Test</h1>
        <h3>Instructor: Muhammad Shaheer Jamal Chishti</h3>
        <p>Total Questions: 20 | Topics: Adjectives, Articles</p>
    </div>

    <div id="quiz-container"></div>
    
    <div class="controls">
        <button onclick="finishTest()">Finish Test & Generate PDF Report</button>
    </div>

    <div id="score-display">Final Score: <span id="final-score">0</span> / 20</div>
    <div id="error-report"></div>

    <script>
        const quizData = [
            // SECTION 1: ADJECTIVES
            { section: "Section 1: Adjectives", q: "1. The weather today is very ___.", options: ["beautiful", "beautifully", "beauty"], a: "beautiful", rule: "An adjective describes a noun. 'Beautiful' describes the weather." },
            { q: "2. This math puzzle is ___ than the one we did yesterday.", options: ["easy", "easiest", "easier"], a: "easier", rule: "When comparing two things, use the comparative degree (easier)." },
            { q: "3. I am getting completely bored ___ this long movie.", options: ["of", "about", "with"], a: "with", rule: "The adjective 'bored' is naturally followed by the preposition 'with'." },
            { q: "4. My father is very excited ___ his new job promotion.", options: ["of", "with", "about"], a: "about", rule: "Certain adjectives are naturally followed by 'about', such as excited about, happy about, and upset about." },
            { q: "5. He was deeply sorry ___ breaking the expensive vase.", options: ["with", "of", "about"], a: "about", rule: "The adjective 'sorry' expressing regret for an action is followed by 'about'." },
            { q: "6. She was very upset ___ losing her favorite watch.", options: ["of", "with", "about"], a: "about", rule: "Emotions like upset, angry, and furious regarding an event are followed by 'about'." },
            { q: "7. Between the two sisters, Sarah is definitely the ___.", options: ["smartest", "more smart", "smarter"], a: "smarter", rule: "Even with 'the', when comparing exactly two people, we use the comparative degree (smarter), not the superlative (smartest)." },
            { q: "8. The new apartment is fully furnished ___ modern furniture.", options: ["by", "with", "about"], a: "with", rule: "The adjective 'furnished' is always paired with the preposition 'with'." },
            { q: "9. She was wearing a ___ dress to the party.", options: ["beautiful long black silk", "black long beautiful silk", "silk beautiful black long"], a: "beautiful long black silk", rule: "The correct order of adjectives is: Opinion (beautiful), Size/Length (long), Color (black), Material (silk)." },
            { q: "10. Since he has ___ friends in the new city, he often feels very lonely.", options: ["a few", "a little", "few"], a: "few", rule: "'Few' means almost none and has a negative meaning (causing loneliness). 'A few' means some, which would be positive. Friends are countable, so we cannot use 'a little'." },

            // SECTION 2: ARTICLES
            { section: "Section 2: Articles & Determiners", q: "11. I saw ___ dog running in the park.", options: ["a", "an", "the"], a: "a", rule: "Use 'a' for a singular, non-specific noun starting with a consonant." },
            { q: "12. Look at ___ sun! It is incredibly bright today.", options: ["a", "an", "the"], a: "the", rule: "Use 'the' for unique objects in nature (the sun, the moon, the earth)." },
            { q: "13. My brother wants to be ___ astronaut when he grows up.", options: ["a", "an", "the"], a: "an", rule: "Use 'an' before a singular profession starting with a vowel sound." },
            { q: "14. Would you like ___ cup of tea?", options: ["the", "an", "a"], a: "a", rule: "Use 'a' for general, non-specific items. You are asking for any cup of tea, not a specific one." },
            { q: "15. He returned the lost wallet because he is ___ honest man.", options: ["a", "an", "the"], a: "an", rule: "Use 'an' before words starting with a vowel SOUND. The 'h' in honest is silent." },
            { q: "16. My cousin is currently studying at ___ university.", options: ["a", "an", "the"], a: "a", rule: "Use 'a' before words starting with a consonant SOUND. 'University' starts with a 'Y' sound (yoo-ni-ver-si-ty)." },
            { q: "17. Excuse me, what is ___ name of your school?", options: ["a", "an", "the"], a: "the", rule: "Use 'the' because you are asking for a specific name of a specific school, not just any random name." },
            { q: "18. I bought a pen and a pencil. ___ pen is red, but ___ pencil is blue.", options: ["A / a", "The / the", "A / the"], a: "The / the", rule: "Use 'the' when referring to a noun that has already been mentioned in the previous sentence." },
            { q: "19. My uncle is ___ European citizen, and he owns ___ one-eyed dog.", options: ["an / an", "an / a", "a / a"], a: "a / a", rule: "Both words start with consonant SOUNDS. 'European' sounds like 'Yoo', and 'one-eyed' sounds like 'Won'. Therefore, both take 'a'." },
            { q: "20. ___ water is essential for human life, but ___ water in this bottle is extremely dirty.", options: ["[No Article] / the", "The / the", "A / the"], a: "[No Article] / the", rule: "Use no article for uncountable nouns speaking generally (water is essential). Use 'the' when specifying which water (the water in this bottle)." }
        ];

        let score = 0;
        let incorrectLog = [];
        const container = document.getElementById('quiz-container');
        const answeredQuestions = new Set();

        // Render the Quiz
        quizData.forEach((item, qIndex) => {
            if (item.section) {
                const secTitle = document.createElement('h2');
                secTitle.className = 'section-title';
                secTitle.innerText = item.section;
                container.appendChild(secTitle);
            }

            const qCard = document.createElement('div');
            qCard.className = `question-card`;
            qCard.id = `card-${qIndex}`;
            
            let html = `
                <div class="question-text">${item.q}</div>
            `;
            
            item.options.forEach((opt, optIndex) => {
                html += `
                    <label class="option-label" id="label-${qIndex}-${optIndex}">
                        <input type="radio" name="q${qIndex}" value="${opt}" onchange="checkAnswer(${qIndex}, '${opt}', '${item.a}', this, '${item.rule}')">
                        ${opt}
                    </label>
                `;
            });

            qCard.innerHTML = html;
            container.appendChild(qCard);
        });

        // Validation Logic
        function checkAnswer(qIndex, selectedAns, correctAns, radioInput, rule) {
            const card = document.getElementById(`card-${qIndex}`);
            
            if (card.classList.contains('locked')) return;

            answeredQuestions.add(qIndex);
            const label = radioInput.parentElement;

            if (selectedAns === correctAns) {
                label.classList.add('correct');
                score++;
            } else {
                label.classList.add('incorrect');
                
                incorrectLog.push({
                    q: quizData[qIndex].q,
                    studentAns: selectedAns,
                    correctAns: correctAns,
                    rule: rule
                });
            }

            card.classList.add('locked');
            
            const nextCard = document.getElementById(`card-${qIndex + 1}`);
            if (nextCard) {
                setTimeout(() => {
                    nextCard.scrollIntoView({ behavior: "smooth", block: "center" });
                }, 400);
            }
        }

        // Finalize Test
        function finishTest() {
            quizData.forEach((item, index) => {
                if (!answeredQuestions.has(index)) {
                    document.getElementById(`card-${index}`).classList.add('locked');
                    incorrectLog.push({
                        q: item.q,
                        studentAns: "(Left Blank)",
                        correctAns: item.a,
                        rule: item.rule
                    });
                }
            });

            document.getElementById('score-display').style.display = 'block';
            document.getElementById('final-score').innerText = score;
            
            const reportDiv = document.getElementById('error-report');
            
            if (incorrectLog.length > 0) {
                let html = `<h2>Correction Report</h2><p>Review the exact logic and rules for the questions you missed.</p>`;
                
                incorrectLog.forEach((err) => {
                    html += `
                    <div class="error-item">
                        <p class="question-text">${err.q}</p>
                        <div class="wrong-ans">[X] Your Answer: ${err.studentAns}</div>
                        <div class="right-ans">[+] Correct Answer: ${err.correctAns}</div>
                        <p class="reason-text"><strong>Logical Rule:</strong> ${err.rule}</p>
                    </div>`;
                });
                reportDiv.innerHTML = html;
            } else {
                reportDiv.innerHTML = `<h2 style="color:var(--correct-dark)">Perfect Score! Outstanding Job.</h2>`;
            }
            
            reportDiv.style.display = 'block';
            
            setTimeout(() => {
                window.print();
            }, 500);
        }
    </script>
</body>
</html>
